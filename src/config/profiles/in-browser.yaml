# A small brain on one small model that runs in this browser (WebGPU), no key
# needed. About 1.5 GB downloads once. Much weaker and slower than the hosted
# models (roughly 20 tokens a second on a mid-range graphics card), so only the
# core voices take part, turns are kept short and there are fewer of them.
default:
  model: browser:Qwen3.5-2B-q4f32_1-MLC
  think: false
  options: {num_predict: 350}   # the Drafter keeps its own, longer limit
agents:
  Logician: {think: false, options: {num_predict: 500}}
  Associator: {enabled: false}
  Inventor: {enabled: false}
  Curator: {enabled: false}
  Storyteller: {enabled: false}
  Coordinator: {enabled: false}
  Recall: {enabled: false}
cycle:
  max_cycles: 6
  max_turns: 3
  wrap_cycles: 3
  max_seconds: 900
